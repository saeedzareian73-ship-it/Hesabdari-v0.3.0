<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#145c4b">
  <meta name="description" content="مدیریت فروش، فاکتورها، دریافت‌ها، موجودی انبار و حساب مشتریان">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <title>دفتر حساب</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="access-gate" class="access-gate" aria-live="polite">
    <div id="access-gate-content" class="access-gate-card"></div>
  </section>
  <div id="app" class="app-shell" hidden>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">د</div>
        <div><div class="brand-name">دفتر حساب</div><div class="brand-sub" id="workspace-caption">مدیریت فروش و حساب مشتریان</div></div>
      </div>
      <div class="top-actions"><button class="icon-btn back-btn" id="back-page" aria-label="برگشت به صفحه قبل" title="برگشت"><span class="back-arrow" aria-hidden="true">←</span><span>برگشت</span></button><button class="icon-btn" id="quick-add" aria-label="ثبت سریع" title="ثبت سریع">＋</button></div>
    </header>

    <main id="main" class="main-content" tabindex="-1"></main>

    <nav class="bottom-nav" aria-label="بخش‌های برنامه">
      <button data-page="dashboard" class="nav-item active"><span>⌂</span><small>خانه</small></button>
      <button data-page="customers" class="nav-item"><span>♙</span><small>مشتریان</small></button>
      <button data-page="invoices" class="nav-item"><span>▤</span><small>فاکتورها</small></button>
      <button data-page="payments" class="nav-item"><span>↙</span><small>دریافت‌ها</small></button>
      <button data-page="more" class="nav-item"><span>•••</span><small>بیشتر</small></button>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" aria-live="polite"></div>
  <input id="restore-file" type="file" accept=".json,application/json" hidden>
  <script src="firebase-config.js"></script>
  <script src="firebase-cloud.js"></script>
  <script src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
